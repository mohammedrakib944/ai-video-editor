[package]
name = "studio"
version = "0.1.0"
edition = "2021"
description = "AI Video Editor — motion graphics studio for product showcases (Iced rewrite)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ai-video-studio"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "lazy", "markdown", "tokio", "wgpu"] }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "drop_down", "spinner"] }
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "time"] }
pollster = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
