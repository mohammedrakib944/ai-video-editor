[package]
name = "studio"
version = "0.1.0"
edition = "2021"
description = "AI Video Editor — motion graphics studio for product showcases (Iced rewrite)"
publish = false

[[bin]]
name = "ai-video-studio"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "lazy", "tokio", "wgpu"] }
anyhow = "1"
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "drop_down", "spinner"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
