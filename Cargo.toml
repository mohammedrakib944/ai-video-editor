[package]
name = "ai-video-editor"
version = "0.1.0"
edition = "2021"
description = "Lightweight Windows video editor with live preview, driven by Claude through MCP"

[[bin]]
name = "ai-video-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rfd = "0.15"
cpal = "0.15"
tiny_http = "0.12"
ureq = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
egui-phosphor = "0.9"

# Window-system backends; default features are off above, so Linux needs them explicitly.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11"] }

[dev-dependencies]
egui_kittest = "0.31"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
